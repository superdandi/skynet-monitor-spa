name: Update Data

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run data updater
        run: node scripts/update-data.mjs

      - name: Commit changes
        id: commit
        run: |
          git config user.name "skynet-bot"
          git config user.email "skynet-bot@users.noreply.github.com"
          git add public/data/dashboard.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: auto-refresh incidents ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push origin main
          fi